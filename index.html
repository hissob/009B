<!--
  «Валюта» (проект Б009) · приложение и консоль · только Supabase, схема b009 (правки 01–04).
  Ключ ниже — публичный anon: без входа он не открывает ничего, таблицы
  закрыты, каждая функция проверяет вход и права.
  Обновление: страница сама сверяет свою версию с сайтом и перезагружается,
  вход сохраняется.
-->
<style>
:root{--bg:#0e1014;--c:#171a21;--c2:#1f232c;--l:#2a2f3a;--t:#e8eaef;--m:#8a909c;--ok:#36d07d;--bad:#ff6b6b;--acc:#a78bfa;--y:#f5c451;--b:#4a9eff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:520px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;color:var(--t)}
h1{font-size:20px;margin:0;letter-spacing:.03em}.mu{color:var(--m);font-size:12px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:7px 11px;font-size:14px}
.tabs{display:flex;gap:4px;margin:12px 0 10px}
.tabs button{flex:1;min-width:0;padding:10px 0;border-radius:12px;background:var(--c);border:1px solid var(--l);color:var(--m);font-weight:800;font-size:10.5px;letter-spacing:0}
.tabs button[data-t=konsol]{flex:.55}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:12px 14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}
.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}.p{color:var(--ok)}.r{color:var(--bad)}.y{color:var(--y)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kgrid.one{grid-template-columns:1fr}.kgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.kgrid.three .kb{padding:8px 9px}.kgrid.three .kb .v{font-size:15px}.kgrid.three .kb .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fTip button{font-size:12px;padding:11px 2px}
.tel{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:4px 10px;border-radius:10px;background:rgba(74,158,255,.12);color:var(--b);font-weight:800;font-size:13px;text-decoration:none}
.kb{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:9px 12px;text-align:left}
.kb .k{font-size:12px;color:var(--m);font-weight:600}.kb .v{font-size:19px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}
.kb.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
label{display:block;font-size:11px;color:var(--m);margin:10px 0 4px}
input{width:100%;background:var(--c2);border:1px solid var(--l);border-radius:12px;padding:11px 12px;color:var(--t);font:inherit;font-weight:600}
input.big{font-size:17px}
input:focus{outline:none;border-color:var(--acc)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}.two.eq{grid-template-columns:1fr 1fr}
.btn{width:100%;margin-top:12px;background:var(--acc);color:#111;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px}
.btn.sec{background:var(--c2);color:var(--t);border:1px solid var(--l)}.btn:disabled{opacity:.45}
.seg{display:flex;gap:6px;margin-top:9px}.seg button{flex:1;padding:11px 4px;border-radius:12px;background:var(--c2);border:1px solid var(--l);font-size:13px;font-weight:800;color:var(--m)}
.seg button.on{border-color:var(--b);color:var(--b)}.seg button.on.g{border-color:var(--ok);color:var(--ok);background:rgba(54,208,125,.08)}.seg button.on.rr{border-color:var(--bad);color:var(--bad);background:rgba(255,107,107,.08)}
.seg.sm button{padding:8px 4px;font-size:12px}
.chip{display:inline-block;margin-top:6px;font-size:12px;padding:3px 10px;border-radius:10px;font-weight:700;background:var(--c2);color:var(--m)}
.chip.p{background:rgba(54,208,125,.13);color:var(--ok)}.chip.r{background:rgba(255,107,107,.13);color:var(--bad)}
.usd{margin-top:8px;font-size:16px;font-weight:800;color:var(--b);font-variant-numeric:tabular-nums;min-height:20px}
.ac{position:relative}.ac-list{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--c2);border:1px solid var(--l);border-radius:12px;margin-top:4px;max-height:240px;overflow:auto;display:none}
.ac-list div{padding:10px 12px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.ac-list div:last-child{border:0}
.it{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:10px 12px;margin:7px 0}
.it.off{opacity:.45}.it .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.it .meta{font-size:12px;color:var(--m);margin-top:3px}
.pr{font-size:11px;color:var(--acc);border:1px solid rgba(167,139,250,.45);border-radius:9px;padding:1px 8px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill{white-space:nowrap;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;background:rgba(54,208,125,.15);color:var(--ok)}
.pill.b{background:rgba(255,107,107,.15);color:var(--bad)}.pill.m{background:var(--c2);color:var(--m)}
.day{font-size:12px;color:var(--m);font-weight:800;margin:14px 0 2px;display:flex;justify-content:space-between}
.note{font-size:12px;color:var(--m);margin-top:8px;line-height:1.5}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2f3a;border:1px solid var(--l);border-radius:12px;padding:10px 14px;opacity:0;transition:.18s;pointer-events:none;z-index:30;max-width:92%;text-align:center}
.toast.on{opacity:1}.toast.bad{background:#3a1d20;color:#ffc2c2}
.ban{background:rgba(74,158,255,.12);border:1px solid rgba(74,158,255,.4);color:#cfe4ff;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:8px}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chk span{padding:7px 11px;border-radius:20px;background:var(--c2);border:1px solid var(--l);font-size:13px;color:var(--m);cursor:pointer}
.chk span.on{border-color:var(--ok);color:var(--ok)}
.bar{height:7px;border-radius:5px;background:var(--c2);overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:24px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--l);border-bottom:0;border-radius:22px 22px 0 0;padding:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.str{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;padding:6px 0;border-bottom:1px solid var(--l)}
.str .h{grid-column:1/3;font-size:12px;color:var(--m);font-weight:700}
.dt{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:12px}.dt>div{min-width:0}
/* iPhone: дата и время не налезают друг на друга */
.dt input{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:44px;padding:10px;font-size:14px;text-align:left}
.dt input::-webkit-date-and-time-value{text-align:left;margin:0}
.rp{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:10px 12px;margin:10px 0;cursor:pointer}
.rp .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}.rp .g div{background:var(--c2);border-radius:10px;padding:7px 7px;overflow:hidden}
.rp .k{font-size:10px;color:var(--m);font-weight:800;letter-spacing:.04em;white-space:nowrap}.rp .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.cur{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:2px;background:rgba(74,158,255,.15);color:var(--b)}
.cur.rub{background:rgba(255,107,107,.15);color:var(--bad)}.cur.zm{background:rgba(54,208,125,.15);color:var(--ok)}
.bl{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:4px 14px;margin:10px 0}
.bl .hh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 6px;border-bottom:1px solid var(--l)}
.bl .it2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--l);cursor:pointer}
.bl .it2:last-child{border:0}.bl .ft{display:flex;justify-content:space-between;padding:9px 0 10px;font-weight:800;border-top:2px solid var(--l)}
.hero{background:linear-gradient(135deg,rgba(167,139,250,.16),var(--c));border:1px solid rgba(167,139,250,.4);border-radius:18px;padding:14px 16px;margin:10px 0}
.logo{display:flex;flex-direction:column;align-items:center;margin:46px 0 14px}.logo svg{width:92px;height:92px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.logo h1{margin:14px 0 2px;font-size:28px}.hlogo{display:flex;align-items:center;gap:10px}.hlogo svg{width:34px;height:34px}
.btn.wait{opacity:1!important;background:#c98a1c}.btn.done{background:var(--ok)!important}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:sh .4s}.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tri{display:flex;background:var(--c2);border-radius:10px;padding:3px;gap:3px;flex:none}.tri span{padding:6px 8px;border-radius:8px;font-size:12px;font-weight:800;color:var(--m);cursor:pointer;white-space:nowrap}
.tri span.n.on{background:rgba(255,107,107,.18);color:var(--bad)}.tri span.r.on{background:rgba(74,158,255,.18);color:var(--b)}.tri span.w.on{background:rgba(54,208,125,.18);color:var(--ok)}
.sw{width:42px;height:24px;border-radius:12px;background:var(--l);position:relative;flex:none;cursor:pointer;transition:.15s}.sw.on{background:var(--ok)}.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.sw.on i{left:21px}
.lb2{font-size:11px;color:var(--m);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 2px}
.mini{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.mini span{font-size:10.5px;padding:1px 6px;border-radius:6px;font-weight:700}
.mini .w{background:rgba(54,208,125,.15);color:var(--ok)}.mini .r{background:rgba(74,158,255,.15);color:var(--b)}.mini .n{background:var(--c2);color:var(--m);text-decoration:line-through}
.btn.red{background:rgba(255,107,107,.12);color:var(--bad);border:1px solid rgba(255,107,107,.5)}.btn.grn{background:rgba(54,208,125,.12);color:var(--ok);border:1px solid rgba(54,208,125,.5)}
.adm{font-size:12px;color:var(--m);margin-top:8px}.adm input{width:auto;display:inline;padding:0;margin-right:6px}
</style></head>
