<!--

.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:7px 11px;font-size:14px}
.tabs{display:flex;gap:5px;margin:12px 0 10px}
.tabs button{flex:1;min-width:0;padding:10px 2px;border-radius:12px;background:var(--c);border:1px solid var(--l);color:var(--m);font-weight:800;font-size:12px;letter-spacing:.02em}
.tabs button.on{border-color:var(--acc);color:var(--acc)}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}
.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}.p{color:var(--ok)}.r{color:var(--bad)}.y{color:var(--y)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kgrid.one{grid-template-columns:1fr}
.kb{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:9px 12px;text-align:left}
.kb .k{font-size:12px;color:var(--m);font-weight:600}.kb .v{font-size:19px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums}
.kb.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
label{display:block;font-size:11px;color:var(--m);margin:10px 0 4px}

.ac{position:relative}.ac-list{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--c2);border:1px solid var(--l);border-radius:12px;margin-top:4px;max-height:240px;overflow:auto;display:none}

.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2f3a;border:1px solid var(--l);border-radius:12px;padding:10px 14px;opacity:0;transition:.18s;pointer-events:none;z-index:30;max-width:92%;text-align:center}
.toast.on{opacity:1}.toast.bad{background:#3a1d20;color:#ffc2c2}
.ban{background:rgba(74,158,255,.12);border:1px solid rgba(74,158,255,.4);color:#cfe4ff;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:8px}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chk span{padding:7px 11px;border-radius:20px;background:var(--c2);border:1px solid var(--l);font-size:13px;color:var(--m);cursor:pointer}

.adm{font-size:12px;color:var(--m);margin-top:8px}.adm input{width:auto;display:inline;padding:0;margin-right:6px}

<script>
'use strict';
const ВЕРСИЯ = 'Б 1.2';
const SB = 'https://lyxxbonoycdsulralmfg.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5eHhib25veWNkc3VscmFsbWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzcyNTAsImV4cCI6MjEwMzc1MzI1MH0.bHKwEj7z94RKlPGGFGn6vB6W3Nlu99-psz9wvFefRis';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const чт = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const пш = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const ф = (n, д = 0) => (Math.round((Number(n) || 0) * 10 ** д) / 10 ** д).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: д }).replace(/\u00a0/g, ' ');
const фз = (n, д = 0) => (n > 0.0000001 ? '+' : n < -0.0000001 ? '−' : '') + ф(Math.abs(n), д);
const число = s => { const t = String(s == null ? '' : s).replace(/\s/g, '').replace(',', '.'); return t === '' || isNaN(+t) ? null : Number(t); };
const ВАЛ = { USD: '$', RUB: '₽', USDT: 'USDT' };
const мскДень = d => new Date(new Date(d).getTime() + 3 * 36e5).toISOString().slice(0, 10);
const мскВремя = d => new Date(new Date(d).getTime() + 3 * 36e5).toISOString().slice(11, 16);
const деньРус = д => д.slice(8, 10) + '.' + д.slice(5, 7);
const ИМЯ_КАССЫ = { 'Касса Москва': 'Москва ₽', 'Касса Москва $': 'Москва $', 'Касса Ташкент': 'Ташкент', 'Тезер': 'Тезер', 'Касса Турция': 'Стамбул' };
const кИмя = n => ИМЯ_КАССЫ[n] || String(n || '').replace(/^Касса /, '');
const ИСТ = { tezer: ['💠', 'Тезер · продажа сверху'], kurs: ['₽', 'Разница курса рублей'], usluga: ['✈', 'Услуги · перевод'], perevod: ['⇄', 'Перевод между кассами'], stambul: ['🇹🇷', 'Стамбул'], prochee: ['•', 'Прочее'] };
let ТОК = чт('b9_tok', ''), Я = JSON.parse(чт('b9_me', 'null') || 'null'), СЧЕТА = [], СВОД = null, АДМИН = false, МИНУТ = 10;

function тост(т, плохо) { const e = $('toast'); e.textContent = т || ''; e.className = 'toast on' + (плохо ? ' bad' : ''); clearTimeout(тост.т); тост.т = setTimeout(() => e.className = 'toast', 2800); }
async function rpc(fn, args) {
  try {
    const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Content-Profile': 'b009', 'Accept-Profile': 'b009' },
      body: JSON.stringify(args || {}) });
    const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (e) {}
    if (!r.ok) return { ok: false, error: (j && j.message) || ('База ' + r.status) };
    if (j && j.code === 'token') выйти('Вход устарел — войди заново');
    return j;
  } catch (e) { return { ok: false, error: 'Нет связи' }; }
}
const можно = п => !!Я && (Я.prava || []).some(x => x === 'admin' || x === п);

// ---------- ОБНОВЛЕНИЕ БЕЗ ПЕРЕЗАХОДА ----------
// Страница сама сверяет свою версию с той, что лежит на сайте. Новее —
// перезагружается; вход (токен) хранится в браузере и не теряется.
async function проверитьВерсию() {
  if (location.protocol === 'file:') return;
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const ВЕРСИЯ = '([^']+)'/);
    if (m && m[1] !== ВЕРСИЯ && чт('b9_upd_try', '') !== m[1]) { пш('b9_upd_try', m[1]); пш('b9_upd', m[1]); location.reload(); }
  } catch (e) {}
}
setInterval(проверитьВерсию, 3 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) проверитьВерсию(); });
if (чт('b9_upd', '') === ВЕРСИЯ) { пш('b9_upd', null); setTimeout(() => { $('ban').textContent = '↻ Обновлено до ' + ВЕРСИЯ + ' — вход сохранён'; $('ban').classList.remove('hide'); setTimeout(() => $('ban').classList.add('hide'), 6000); }, 300); }

// ---------- ВХОД ----------
$('verL').textContent = ВЕРСИЯ; $('ver').textContent = ВЕРСИЯ;
$('btnLogin').onclick = async () => {
  $('lgErr').textContent = ''; $('btnLogin').disabled = true;
  const r = await rpc('login', { p_login: $('lg').value.trim(), p_pass: $('pw').value, p_ver: ВЕРСИЯ });
  $('btnLogin').disabled = false;
  if (!r || !r.ok) { $('lgErr').textContent = (r && r.error) || 'Ошибка'; return; }
  ТОК = r.token; Я = { name: r.name, prava: r.prava, kassy: r.kassy };
  пш('b9_tok', ТОК); пш('b9_me', JSON.stringify(Я)); $('pw').value = '';
  открыть();
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('btnLogin').click(); };
function выйти(почему) { ТОК = ''; Я = null; пш('b9_tok', null); пш('b9_me', null); $('scrApp').classList.add('hide'); $('scrLogin').classList.remove('hide'); if (почему) $('lgErr').textContent = почему; }
$('btnOut').onclick = () => выйти();

async function загрузить() {
  const [с, в] = await Promise.all([rpc('scheta_spisok', { p_token: ТОК }), rpc('svod', { p_token: ТОК })]);
  if (с && с.ok) { СЧЕТА = с.scheta; АДМИН = с.admin; МИНУТ = с.minut; }
  if (в && в.ok) СВОД = в;
}
const кассы = () => СЧЕТА.filter(s => s.vid === 'kassa');
