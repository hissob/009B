<style>

<script>
const SB = 'https://lyxxbonoycdsulralmfg.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5eHhib25veWNkc3VscmFsbWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzcyNTAsImV4cCI6MjEwMzc1MzI1MH0.bHKwEj7z94RKlPGGFGn6vB6W3Nlu99-psz9wvFefRis';

const ф = (n, d) => { n = Number(n) || 0; const dd = d === undefined ? (Math.abs(n % 1) > 0.004 ? 2 : 0) : d;
  return n.toLocaleString('ru-RU', { minimumFractionDigits: dd, maximumFractionDigits: dd }).replace(/[  ]/g, ' ').replace(/^-/, '−'); };
const число = s => { const v = parseFloat(String(s || '').replace(/\s/g, '').replace(',', '.')); return isNaN(v) ? null : v; };
const мск = t => new Date(new Date(t).getTime() + 3 * 3600000).toISOString();
const дт = t => { const s = мск(t); return s.slice(8, 10) + '.' + s.slice(5, 7) + ' ' + s.slice(11, 16); };
const сегодня = () => мск(Date.now()).slice(0, 10);

let ТОК = '', АДМ = false, ВКЛ = 'sdelka';
try { ТОК = localStorage.getItem('b9t_tok') || ''; } catch (e) {}

function тост(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
async function rpc(fn, args, схема) {
  try {
    const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Content-Profile': схема || 'b9t', 'Accept-Profile': схема || 'b9t' },
      body: JSON.stringify(args || {}) });
    const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (e) {}
    if (!r.ok) { const m = (j && j.message) || ('База ' + r.status); if (/Вход устарел|Нет входа/.test(m)) выйти(m); return { ok: false, error: m }; }

function seg(id, cb) { $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;

async function старт() {
  if (!ТОК) { выйти(); return; }
  const с = await rpc('svod', { p_token: ТОК });
  if (!с || !с.ok) { выйти(с && с.error); return; }

  $('kto').textContent = АДМ ? 'админ' : ''; имена(); вид();

// ---------- вкладки ----------
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; ВКЛ = b.dataset.t;
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  ['sdelka', 'msk', 'tsh', 'otchet', 'lenta'].forEach(t => скрыть('t_' + t, t !== ВКЛ));
  ({ msk: рисМ, tsh: рисТ, otchet: рисО, lenta: рисЛ })[ВКЛ]?.(); };
['mNa', 'tNa', 'oNa'].forEach(i => $(i).onchange = () => ({ mNa: рисМ, tNa: рисТ, oNa: рисО })[i]());
seg('oVid', () => рисО()); seg('oKt', () => рисК()); seg('oF', () => рисК()); $('oPoisk').addEventListener('input', () => рисК());

// ---------- ЗАПИСЬ ----------
seg('sTip', v => { скрыть('fZay', v !== 'zay'); скрыть('fMsk', v !== 'msk'); скрыть('fTez', v !== 'tez'); скрыть('fStart', v !== 'start'); $('fErr').textContent = ''; });

  const с = $('fSrazu').children; с[0].textContent = v === 'berish' ? 'В долг' : 'Должны ему'; с[1].textContent = v === 'berish' ? 'Внёс в кассу' : 'Отдали из кассы'; с[2].textContent = v === 'berish' ? 'На карту' : 'С карты'; });
seg('fMesto'); seg('fOpl'); seg('fSrazu'); seg('mNapr'); seg('mVal'); seg('mGde'); seg('tTip'); seg('tSr'); seg('tM'); seg('stK');
$('fPr').addEventListener('input', () => { const X = число($('fSum').value), p = число($('fPr').value); if (X && p != null) $('fUsl').value = String(Math.round(X * p) / 100).replace('.', ','); вид(); });
$('fSum').addEventListener('input', () => { const X = число($('fSum').value), p = число($('fPr').value); if (X && p != null) $('fUsl').value = String(Math.round(X * p) / 100).replace('.', ','); });

document.querySelectorAll('#t_sdelka input').forEach(i => i.addEventListener('input', () => вид()));
const место = v => (v || '').replace('Касса ', '');
const другая = v => v === 'Касса Ташкент' ? 'Стамбул' : 'Ташкент';

function вид() {
  const тип = val('sTip');
  if (тип === 'zay') { const o = val('fOpl'), бер = val('fNapr') === 'berish';
    скрыть('fRubW', o !== 'rub'); скрыть('fUrW', o !== 'usd_rub'); скрыть('fSrazuW', o === 'tsh');
